name: Pflege Scraper 2027
on:
  workflow_dispatch:
  schedule:
    - cron: \'0 7 * * *\'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \'3.11\'
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - uses: actions/upload-artifact@v4
        with:
          name: pflege-excel-2027
          path: pflege_ausbildung_2027.xlsx
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add pflege_ausbildung_2027.xlsx
          git commit -m "update 100 offres" || exit 0
          git push
